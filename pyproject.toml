[project]
name = "rhs-wisley-bug-watch"
version = "0.1.0"
description = "Machine learning pipeline for identifying Thrips and Pirate Bugs from Zooniverse consensus data."
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "matplotlib>=3.9.0",
    "numpy>=1.26.0,<2.0.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.2",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "pandas>=2.2.2",
    "pillow>=10.3.0",
    "ipykernel>=7.3.0",
]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
